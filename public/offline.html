<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Reconnecting…</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0e0a07;
        color: #f6efe6;
        font-family: system-ui, sans-serif;
        text-align: center;
        padding: 24px;
        box-sizing: border-box;
      }
      .dot {
        width: 64px;
        height: 64px;
        border-radius: 50%;
        margin: 0 auto 24px;
        background: linear-gradient(135deg, #f7b84b, #e5533d);
        animation: pulse 1.6s ease-in-out infinite;
      }
      h1 {
        font-size: 28px;
        margin: 0 0 8px;
      }
      p {
        margin: 4px 0;
        opacity: 0.85;
      }
      button {
        margin-top: 24px;
        min-height: 48px;
        padding: 0 24px;
        border: 0;
        border-radius: 12px;
        background: #f5a524;
        color: #1a1206;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
      }
      button:focus-visible {
        outline: 3px solid #fff3d6;
        outline-offset: 3px;
      }
      @keyframes pulse {
        50% {
          transform: scale(0.88);
          opacity: 0.7;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .dot {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="dot" aria-hidden="true"></div>
      <h1>Reconnecting…</h1>
      <p lang="bn">আবার সংযোগ করা হচ্ছে…</p>
      <p>No connection right now. This screen comes back on its own.</p>
      <button type="button" onclick="location.reload()">Try again · আবার চেষ্টা করুন</button>
    </main>
    <script>
      // Reload as soon as the network is back.
      window.addEventListener("online", function () {
        location.reload();
      });
      setInterval(function () {
        if (navigator.onLine) location.reload();
      }, 15000);
    </script>
  </body>
</html>
